<!doctype html>
<html>
<head><meta charset="utf-8"><title>Platform - Login</title></head>
<body data-page="auth">
  <center><h1>Platform</h1><p id="message"></p></center>
  <font size="5">
    <h2>Log in</h2>
    <form id="login-form">User: <input id="login-user" required><br><br>Password: <input id="login-password" type="password" required><br><br><button>Log in</button></form>
    <hr><h2>Sign up</h2>
    <form id="signup-form">Name: <input id="signup-name" required><br><br>User: <input id="signup-user" required><br><br>Password: <input id="signup-password" type="password" minlength="6" required><br><br>Age: <input id="signup-age" type="number" min="1" max="120" required><br><br><button>Create account</button></form>
  </font>
  <script type="module" src="app.js"></script>
</body></html>
